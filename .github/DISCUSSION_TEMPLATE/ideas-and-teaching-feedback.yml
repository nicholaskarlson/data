title: "[Idea or teaching feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Use this category to suggest public teaching datasets, improvements to the open practice materials, workflow improvements, accessibility changes, or future companion topics. Keep examples synthetic and do not post private data.
  - type: dropdown
    id: feedback_area
    attributes:
      label: Area
      options:
        - New synthetic teaching dataset
        - Open practice materials
        - Teaching workflow
        - Documentation
        - Accessibility
        - Other public companion improvement
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea or feedback
      description: Describe the change, addition, or teaching need as specifically as you can.
    validations:
      required: true
  - type: textarea
    id: teaching_use
    attributes:
      label: Teaching use
      description: What would a student or instructor be able to learn or do more clearly?
    validations:
      required: true
  - type: textarea
    id: current_material
    attributes:
      label: Related public material
      description: Name any dataset, chapter, workflow, or documentation page this suggestion concerns.
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This is feedback about public teaching material, not a request to complete homework, select a model for an individual study, or provide consulting.
          required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private, identifiable, clinical, institutional, thesis, restricted, client, or student data.
          required: true
