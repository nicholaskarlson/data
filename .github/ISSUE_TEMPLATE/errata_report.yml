name: Errata report
description: Report a likely correction in the book or public companion files.
title: "Errata: "
labels:
  - errata
body:
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: Select the format in which you found the possible error.
      options:
        - Paperback
        - Kindle
        - Other print or digital format
    validations:
      required: true
  - type: input
    id: book_version
    attributes:
      label: Edition, printing, or publication date
      description: Use the edition, printing, or publication date shown in your copy if available.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location in your copy
      description: For print, give the chapter and page plus any table, figure, equation, or exercise number. For Kindle, give the chapter or section and Kindle location.
      placeholder: "For example: Chapter 17, p. 163, Check Yourself 4; or Chapter 17, Kindle location 2841"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What seems wrong?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private, identifiable, clinical, institutional, thesis, restricted, or student data.
          required: true
