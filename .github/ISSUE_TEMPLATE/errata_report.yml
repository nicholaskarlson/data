name: Errata report
description: Report a likely correction in a book, open educational resource, or public companion file.
title: "Errata: "
labels:
  - errata
body:
  - type: dropdown
    id: format
    attributes:
      label: Format
      description: Select the format in which you found the possible error.
      options:
        - Paperback
        - Kindle
        - Open materials PDF
        - Open materials DOCX
        - Other print or digital format
    validations:
      required: true
  - type: input
    id: book_version
    attributes:
      label: Edition, printing, or publication date
      description: Use the edition, printing, or publication date shown in your copy if available.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location in your copy
      description: For print or PDF, give the chapter or unit and page plus any table, figure, equation, problem, or solution number. For Kindle, give the chapter or section and Kindle location.
      placeholder: "For example: Unit 7, p. 82, Problem 14; Chapter 17, p. 163; or Chapter 17, Kindle location 2841"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What seems wrong?
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private, identifiable, clinical, institutional, thesis, restricted, or student data.
          required: true
