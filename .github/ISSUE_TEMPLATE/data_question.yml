name: Data or file question
description: Ask about a public companion dataset, dictionary, or file.
title: "Data/file question: "
labels:
  - companion-files
body:
  - type: input
    id: file_name
    attributes:
      label: File name
    validations:
      required: true
  - type: input
    id: chapter
    attributes:
      label: Chapter or section
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included private, identifiable, clinical, institutional, thesis, restricted, or student data.
          required: true
