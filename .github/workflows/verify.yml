name: verify-public-materials

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify reader assets and open educational materials
        run: make verify
      - name: Build deterministic reader-assets archive
        run: make release

  causal-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: pip install -r open-materials/causal-reasoning-with-statistics/requirements.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Check the companion inventory and provenance
        run: python3 scripts/check_causal_reasoning_companion.py
      - name: Reproduce the book's numbers in both Python paths
        working-directory: open-materials/causal-reasoning-with-statistics
        run: python3 run_all.py
      - name: Reproduce the book's numbers in base R
        working-directory: open-materials/causal-reasoning-with-statistics
        run: Rscript run_all.R
      - name: Confirm the working tree is unchanged
        run: git diff --exit-code
